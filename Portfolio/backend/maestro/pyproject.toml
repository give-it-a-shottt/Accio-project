[project]
name = "maestro"
version = "0.1.0"
description = "마에스트로 — 짜둔 일정에 상황별 대안 식당(변주)을 미리 붙여두는 서비스의 API"
authors = [
    { name = "give-it-a-shottt", email = "jeongseonghoon4537@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
